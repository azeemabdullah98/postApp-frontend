<app-header (auth)="onAuthSelected($event)" />
<main>
  <app-products />
  @if(isLoginSelected){

  <app-login (closeLogin)="onCloseAuth()" [authType]="this.auth" />
  }@if(isSignupSelected) {
  <app-signup (closeSignup)="onCloseAuth()" [authType]="this.auth" />
  } @if(isFavouritesSelected) {
  <app-favourites (closeFavourites)="onCloseAuth()" [authType]="this.auth" />
  }
</main>
