<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>postApp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="p-3 text-bg-dark">
      <div class="container">
        <div
          class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"
        >
          <a
            href="#"
            class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"
          >
            <img
              class="company-logo"
              src="./assets/company-logo.png"
              alt="company-logo"
            />
          </a>
          <ul
            class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"
          >
            <li><a href="#" class="nav-link px-2 text-secondary">Home</a></li>
            <li><a href="#" class="nav-link px-2 text-white">Features</a></li>
            <li><a href="#" class="nav-link px-2 text-white">Pricing</a></li>
            <li><a href="#" class="nav-link px-2 text-white">FAQs</a></li>
            <li><a href="#" class="nav-link px-2 text-white">About</a></li>
          </ul>
          <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search">
            <input
              [(ngModel)]="keyword"
              type="search"
              class="form-control form-control-dark text-bg-light"
              placeholder="Search product..."
              aria-label="Search"
              name="productSearch"
              (keydown)="onKeyDown($event)"
            />
          </form>
          <div class="text-end">
            <button class="btn btn-secondary" (click)="onSearch()">
              Search
            </button>
            @if(isLoggedIn){
            <button
              type="button"
              class="btn btn-warning me-2"
              (click)="onAccountInfo()"
            >
              Account
            </button>
            <button
              type="button"
              class="btn btn-secondary me-2"
              (click)="onAddProduct()"
            >
              Add Product
            </button>
            <button
              type="button"
              class="btn btn-danger me-2"
              (click)="openLogoutModal()"
            >
              Logout
            </button>
            <a
              class="btn btn-outline-light btn-favourite"
              style="border-radius: 20%; height: 38px"
              (click)="onFavourite()"
            >
              <span class="material-symbols-outlined">favorite</span>
              <div class="favourite-count">{{ favProductsSize }}</div>
            </a>
            }@else {
            <button
              type="button"
              class="btn btn-outline-light me-2"
              (click)="onLogin()"
              routerLink="login"
            >
              Login
            </button>
            <button
              type="button"
              class="btn btn-warning me-2"
              (click)="onSignup()"
            >
              Sign-up
            </button>
            }
          </div>
        </div>
      </div>
    </header>
  </body>
  <!-- Delete Confirmation Modal -->
  <div
    class="modal"
    tabindex="-1"
    [ngClass]="{ 'show d-block': showLogoutModal }"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Delete</h5>
          <button
            type="button"
            class="btn-close"
            (click)="closeLogoutModal()"
          ></button>
        </div>
        <div class="modal-body">
          <p>
            Are you sure you want to
            <strong>logout</strong>?
          </p>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline-dark btn-secondary"
            (click)="closeLogoutModal()"
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-outline btn-danger"
            (click)="onLogout()"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- Backdrop -->
  @if(showLogoutModal){

  <div class="modal-backdrop fade show"></div>
  }
</html>
