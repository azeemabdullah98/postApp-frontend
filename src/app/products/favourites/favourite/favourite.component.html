<div class="card">
  <img
    [src]="favouriteProduct.imagePath"
    class="card-img-top"
    alt="product-image"
  />
  <div class="card-body">
    <h5 class="card-title">{{ favouriteProduct.name }}</h5>
    <h2>₹{{ favouriteProduct.price }}</h2>
    <p class="card-text">
      {{ favouriteProduct.description }}
    </p>
  </div>
</div>
