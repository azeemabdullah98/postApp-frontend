<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ authType }}</title>
    <!-- Bootstrap 5 CDN -->
    <style>
      body {
        background: #f0f2f5;
      }
      button.btn-warning {
        background-color: #ffc107;
        color: #212529 !important;
        border: none;
      }

      button.btn-warning:hover {
        background-color: #e0a800;
      }
    </style>
  </head>
  <body>
    <div class="backdrop" id="backdrop" (click)="onCloseLogin()"></div>
    <dialog open>
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close"
        (click)="onCloseLogin()"
      ></button>
      @if (error) {
      <div class="alert alert-danger" role="alert">{{ error }}</div>
      }
      <h3 class="text-center mb-4">{{ authType }}</h3>
      <form (ngSubmit)="onLogin()">
        <div class="form-floating mb-3">
          <input
            type="username"
            class="form-control"
            id="username"
            name="username"
            placeholder="name@example.com"
            required
            [(ngModel)]="this.user.username"
          />
          <label for="email">Username</label>
        </div>

        <div class="form-floating mb-3">
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="password"
            required
            [(ngModel)]="this.user.password"
          />
          <label for="password">Password</label>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-warning me-0">Login</button>
        </div>

        <div class="text-center">
          <a href="#">Forgot password?</a>
        </div>
        <div class="text-center mt-3">
          <span>Don't have an account? </span><a href="#">Sign Up</a>
        </div>
      </form>
    </dialog>
    <!-- Bootstrap JS -->
  </body>
</html>
